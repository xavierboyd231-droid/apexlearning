<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning-68 Games</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --muted-color: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--text-color);
        }

        p {
            color: var(--muted-color);
            margin-top: 0;
        }

        .search-container {
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
        }

        #searchBox {
            width: 100%;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: var(--card-bg);
            color: var(--text-color);
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        #searchBox:focus {
            border-color: var(--accent-color);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .game-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .play-btn {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        .play-btn:hover {
            background-color: var(--accent-hover);
        }

        .no-results {
            color: var(--muted-color);
            grid-column: 1 / -1;
            text-align: center;
            display: none;
            font-size: 1.1rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Learning-68 Portal</h1>
        <p>Select a game below to play</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchBox" placeholder="Search games..." onkeyup="searchGames()">
    </div>

    <div class="grid" id="gameGrid">
        <!-- GAME 1: Change the title and link to match your actual game file name -->
        <div class="game-card">
            <div class="game-title">Game 1 Name</div>
            <a href="game1.html" class="play-btn">Play</a>
        </div>

        <!-- GAME 2 -->
        <div class="game-card">
            <div class="game-title">Game 2 Name</div>
            <a href="game2.html" class="play-btn">Play</a>
        </div>

        <!-- GAME 3 -->
        <div class="game-card">
            <div class="game-title">Game 3 Name</div>
            <a href="game3.html" class="play-btn">Play</a>
        </div>

        <div id="noResults" class="no-results">No games found matching your search.</div>
    </div>

    <script>
        function searchGames() {
            let input = document.getElementById('searchBox').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');
            let foundCount = 0;

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByClassName('game-title')[0].innerText.toLowerCase();
                if (title.includes(input)) {
                    cards[i].style.display = "flex";
                    foundCount++;
                } else {
                    cards[i].style.display = "none";
                }
            }

            document.getElementById('noResults').style.display = foundCount === 0 ? "block" : "none";
        }
    </script>

</body>
</html>
